version: '3.8'

services:
  micita-dev:
    container_name: micita-development
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
    env_file:
      - .env
    volumes:
      # Mount entire source directory for hot reload
      - .:/app
      - /app/node_modules  # Exclude node_modules from host
      
    networks:
      - micita-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  micita-network:
    driver: bridge